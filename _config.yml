title: Sean Zdenek, PhD
tagline: "Access · Sound · Rhetoric · Captioning · Media"
email: seanzdenek@gmail.com
description: "Sean Zdenek is Associate Professor of Technical and Professional Writing at the University of Delaware and author of Reading Sounds: Closed-Captioned Media and Popular Culture (University of Chicago Press, 2015). Research in closed captioning, disability studies, sound studies, subtitles, media accessibility, inclusive design, and rhetoric."
baseurl: ""
url: "https://seanzdenek.com"
author: Sean Zdenek

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Permalink structure to match WordPress date-based URLs
permalink: /:year/:month/:day/:title/

# Minima theme settings
minima:
  skin: classic

# Control which pages appear in the nav bar (in order)
header_pages:
  - cv.html
  - publications.html
  - teaching.html
  - _pages/ap-intro.html
  - blog.html
  - fair-use-notice.html

# Include _pages directory and category pages
include:
  - _pages
  - category
  - .well-known

# Default OG image for social sharing (used by jekyll-seo-tag)
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-image.jpg

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .sass-cache/
  - .jekyll-cache/
  # Unpublished at Sean's request (2026-08-15) — file stays in the repo,
  # just dropped from the build. Remove this line to bring it back live.
  - thrum/
