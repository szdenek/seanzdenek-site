---
layout: default
title: Search
---

<div class="search-page-wrap">
  <h1>Search</h1>
  <div id="search"></div>
  <noscript><p>Search requires JavaScript. Please enable it in your browser.</p></noscript>
</div>

<link rel="stylesheet" href="/_pagefind/pagefind-ui.css">
<script src="/_pagefind/pagefind-ui.js"></script>
<script>
window.addEventListener('DOMContentLoaded', function() {
  if (typeof PagefindUI === 'undefined') {
    document.getElementById('search').innerHTML =
      '<p style="color:#666">Search index not found. The search index is built during deployment — it is not available in local development.</p>';
    return;
  }

  new PagefindUI({ element: '#search', showImages: false, excerptLength: 15 });

  var q = new URLSearchParams(window.location.search).get('q');
  if (q) {
    requestAnimationFrame(function() {
      var input = document.querySelector('.pagefind-ui__search-input');
      if (input) {
        input.value = q;
        input.dispatchEvent(new Event('input', { bubbles: true }));
      }
    });
  }
});
</script>
